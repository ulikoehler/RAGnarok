<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAGnarök</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--dim:#8b949e;
--accent:#58a6ff;--hl:#d2992266;--ok:#3fb950;--warn:#d29922;--err:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
font:14px/1.5 system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;
background:var(--panel);border-bottom:1px solid var(--border)}
header h1{font-size:18px;margin:0}
header h1 span{color:var(--accent)}
#stats{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--dim)}
#stats b{color:var(--fg)}
.pressure-normal{color:var(--ok)}.pressure-soft{color:var(--warn)}
.pressure-hard{color:var(--err)}
main{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 53px)}
aside{border-right:1px solid var(--border);padding:16px;overflow-y:auto}
aside h2{font-size:13px;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
.src{background:var(--panel);border:1px solid var(--border);border-radius:6px;
padding:8px 10px;margin-bottom:8px;font-size:13px}
.src .st{float:right;font-size:11px;color:var(--dim)}
.src .bar{height:3px;background:var(--border);border-radius:2px;margin-top:6px}
.src .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.src button{margin-top:6px;font-size:11px}
#addsrc{margin-top:12px}#addsrc input,#addsrc select{width:100%;margin-bottom:6px}
input,select,button,textarea{background:#0d1117;color:var(--fg);
border:1px solid var(--border);border-radius:6px;padding:6px 8px;font:inherit}
button{background:var(--panel);cursor:pointer}button:hover{border-color:var(--accent)}
#content{padding:20px;overflow-y:auto}
#searchbar{display:flex;gap:8px;margin-bottom:16px}
#searchbar input{flex:1;font-size:15px;padding:8px 12px}
.hit{background:var(--panel);border:1px solid var(--border);border-radius:8px;
padding:12px 14px;margin-bottom:10px;cursor:pointer}
.hit:hover{border-color:var(--accent)}
.hit .meta{font-size:12px;color:var(--dim);margin-bottom:6px}
.hit .meta .score{float:right;color:var(--accent)}
.hit .text{font-size:13px}
mark{background:var(--hl);color:var(--fg);border-radius:2px;padding:0 1px}
#viewer{position:fixed;inset:40px;background:var(--bg);border:1px solid var(--border);
border-radius:10px;display:none;flex-direction:column;z-index:10;overflow:hidden}
#viewer.open{display:flex}
#vhead{display:flex;align-items:center;gap:10px;padding:8px 14px;
background:var(--panel);border-bottom:1px solid var(--border);font-size:13px}
#vhead button{margin-left:auto}
#vbody{flex:1;display:flex;overflow:hidden}
#vdoc{flex:1;border:0;background:#fff}
#vpre{flex:1;overflow:auto;padding:16px;margin:0;font:13px/1.6 ui-monospace,monospace;white-space:pre-wrap}
#vmap{width:180px;border-left:1px solid var(--border);background:var(--panel);
padding:10px;display:none}
#vmap .pagebox{position:relative;background:#fff;border-radius:2px;margin-bottom:10px}
#vmap .hlbox{position:absolute;background:var(--hl);border:1px solid var(--warn);border-radius:1px}
.pagemap-label{font-size:10px;color:#333;text-align:center;padding-top:2px}
.empty{color:var(--dim);text-align:center;margin-top:60px}
</style>
</head>
<body>
<header>
  <h1>RAG<span>narök</span></h1>
  <div id="stats">
    <span>CPU <b id="s-cpu">–</b></span>
    <span>RAM <b id="s-ram">–</b></span>
    <span>Budget <b id="s-budget">–</b></span>
    <span>Docs <b id="s-docs">–</b></span>
    <span>Chunks <b id="s-chunks">–</b></span>
    <span>Files/s <b id="s-fps">–</b></span>
    <span>Pressure <b id="s-pressure" class="pressure-normal">–</b></span>
    <span id="s-ws">●</span>
  </div>
</header>
<main>
<aside>
  <h2>Sources</h2>
  <div id="srclist"></div>
  <div id="addsrc">
    <h2>Add source</h2>
    <input id="ns-name" placeholder="name">
    <select id="ns-type">
      <option value="file_system">Filesystem</option>
      <option value="imap">IMAP (read-only)</option>
    </select>
    <div id="ns-fs">
      <input id="ns-path" placeholder="/path/to/folder">
    </div>
    <div id="ns-imap" style="display:none">
      <input id="ns-host" placeholder="imap host">
      <input id="ns-user" placeholder="username">
      <input id="ns-pwenv" placeholder="password env var" value="IMAP_PASSWORD">
      <input id="ns-mailbox" placeholder="mailbox" value="INBOX">
    </div>
    <button onclick="addSource()">Register</button>
  </div>
</aside>
<div id="content">
  <div id="searchbar">
    <input id="q" placeholder="Hybrid search — dense + sparse + ColBERT…"
         onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">Search</button>
  </div>
  <div id="results"><div class="empty">Index a source, then search across it.</div></div>
</div>
</main>

<div id="viewer">
  <div id="vhead"><b id="vtitle"></b><span id="vinfo" style="color:var(--dim)"></span>
    <button onclick="closeViewer()">✕ close</button></div>
  <div id="vbody">
    <iframe id="vdoc" sandbox="allow-same-origin" style="display:none"></iframe>
    <pre id="vpre" style="display:none"></pre>
    <div id="vmap"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtB=b=>b>1e9?(b/1e9).toFixed(1)+" GiB":b>1e6?(b/1e6).toFixed(0)+" MiB":(b/1e3).toFixed(0)+" KiB";
let lastHits=[],srcStates={},srcList=[];

/* ---------- telemetry websocket ---------- */
function connectWS(){
  const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws/v1/events");
  ws.onopen=()=>{$("s-ws").style.color="var(--ok)"};
  ws.onclose=()=>{$("s-ws").style.color="var(--err)";setTimeout(connectWS,2000)};
  ws.onmessage=e=>{
    const ev=JSON.parse(e.data);
    if(ev.event==="stats"){
      const s=ev;
      $("s-cpu").textContent=s.cpu_percent.toFixed(0)+"%";
      $("s-ram").textContent=fmtB(s.process_rss_bytes)+" / "+fmtB(s.ram_total_bytes);
      $("s-budget").textContent=fmtB(s.budget_bytes);
      $("s-docs").textContent=s.indexed_documents;
      $("s-chunks").textContent=s.indexed_chunks;
      $("s-fps").textContent=s.files_per_sec.toFixed(1);
      const p=$("s-pressure");p.textContent=s.pressure;
      p.className="pressure-"+s.pressure;
    }else if(ev.event==="source_state"){
      srcStates[ev.source_id]=ev;renderSources();
    }
  };
}
connectWS();

/* ---------- sources ---------- */
async function loadSources(){
  srcList=await(await fetch("/api/v1/sources")).json();
  renderSources();
}
function renderSources(){
  $("srclist").innerHTML=srcList.map(s=>{
    const st=srcStates[s.id]||s.state||{};
    const pct=st.files_total?Math.round(100*st.files_indexed/st.files_total):0;
    const kind=s.config.type;
    const detail=kind==="file_system"?s.config.path:(s.config.host+"/"+s.config.mailbox);
    return `<div class="src"><span class="st">${st.status||"pending"}</span>
      <b>${esc(s.name)}</b><br><span style="color:var(--dim);font-size:11px">${esc(kind)} · ${esc(String(detail))}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <span style="font-size:11px;color:var(--dim)">${st.files_indexed||0}/${st.files_total||0} files</span>
      <button onclick="rescan('${s.id}')">rescan</button></div>`;
  }).join("");
}
$("ns-type").onchange=e=>{
  $("ns-fs").style.display=e.target.value==="imap"?"none":"block";
  $("ns-imap").style.display=e.target.value==="imap"?"block":"none";
};
async function addSource(){
  const type=$("ns-type").value,name=$("ns-name").value||"source";
  const config=type==="imap"
    ?{type:"imap",host:$("ns-host").value,username:$("ns-user").value,
      password_env:$("ns-pwenv").value,mailbox:$("ns-mailbox").value}
    :{type:"file_system",path:$("ns-path").value};
  const r=await fetch("/api/v1/sources",{method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({name,config})});
  if(r.ok)loadSources();else alert("failed: "+await r.text());
}
async function rescan(id){
  await fetch("/api/v1/sources/"+id+"/rescan",{method:"POST"});
}

/* ---------- search ---------- */
async function doSearch(){
  const q=$("q").value.trim();if(!q)return;
  const r=await fetch("/api/v1/search",{method:"POST",
    headers:{"content-type":"application/json"},body:JSON.stringify({query:q})});
  lastHits=await r.json();
  renderResults(q);
}
function renderResults(q){
  if(!lastHits.length){$("results").innerHTML='<div class="empty">No hits.</div>';return}
  const terms=q.toLowerCase().split(/\s+/).filter(t=>t.length>2);
  $("results").innerHTML=lastHits.map((h,i)=>{
    let text=esc(h.text.slice(0,400));
    for(const t of terms){
      text=text.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");
    }
    const geo=h.bbox?`p${h.page+1} [${h.bbox.x0.toFixed(2)},${h.bbox.y0.toFixed(2)}→${h.bbox.x1.toFixed(2)},${h.bbox.y1.toFixed(2)}]`:(h.line_range?`lines ${h.line_range[0]+1}–${h.line_range[1]}`:"");
    return `<div class="hit" onclick="openDoc(${i})">
      <div class="meta"><span class="score">${h.score.toFixed(3)}</span>
        ${esc(h.path)} · ${h.doc_type} · ${geo}</div>
      <div class="text">${text}${h.text.length>400?"…":""}</div></div>`;
  }).join("");
}

/* ---------- universal viewer ---------- */
async function openDoc(i){
  const h=lastHits[i];
  $("vtitle").textContent=h.path;
  $("vinfo").textContent=`${h.doc_type}${h.bbox?" · page "+(h.page+1):""}`;
  const url="/api/v1/documents/"+h.document_id+"/stream";
  $("viewer").classList.add("open");
  const iframe=$("vdoc"),pre=$("vpre"),map=$("vmap");
  iframe.style.display="none";pre.style.display="none";map.style.display="none";
  if(h.doc_type==="pdf"){
    // native PDF rendering + geometric match map (page boxes w/ highlights)
    iframe.style.display="block";iframe.src=url;
    drawMap(map,h);
  }else if(h.doc_type==="email"||h.doc_type==="html"){
    iframe.style.display="block";iframe.src=url;
  }else{
    // text/code/markdown: fetch + line highlighting
    const txt=await(await fetch(url)).text();
    pre.style.display="block";
    const lines=txt.split("\n");
    const hl=h.line_range?[h.line_range[0],h.line_range[1]]:[-1,-1];
    pre.innerHTML=lines.map((l,n)=>{
      const s=esc(l);
      return n>=hl[0]&&n<hl[1]?`<mark>${s}</mark>`:s;
    }).join("\n");
    const marks=pre.querySelectorAll("mark");
    if(marks[0])marks[0].scrollIntoView({block:"center"});
  }
}
function drawMap(map,h){
  // geometric page map: normalized bboxes rendered as overlay rects
  const hits=lastHits.filter(x=>x.document_id===h.document_id&&x.bbox);
  if(!hits.length)return;
  map.style.display="block";
  const pages={};hits.forEach(x=>{(pages[x.page]=pages[x.page]||[]).push(x)});
  map.innerHTML=Object.keys(pages).sort((a,b)=>a-b).map(p=>{
    const boxes=pages[p].map(x=>`<div class="hlbox" title="${esc(x.text.slice(0,60))}"
      style="left:${x.bbox.x0*100}%;top:${x.bbox.y0*100}%;width:${(x.bbox.x1-x.bbox.x0)*100}%;height:${(x.bbox.y1-x.bbox.y0)*100}%"></div>`).join("");
    return `<div class="pagebox" style="aspect-ratio:0.772">${boxes}
      <div class="pagemap-label">p. ${+p+1}</div></div>`;
  }).join("");
}
function closeViewer(){$("viewer").classList.remove("open");$("vdoc").src="about:blank"}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeViewer()});

loadSources();setInterval(loadSources,10000);
</script>
</body>
</html>
