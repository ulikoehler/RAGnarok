[package]
name = "ragnarok-inference"
version = "2.0.0"
edition.workspace = true
description = "BGE-M3 embedding pipeline: dense, sparse and ColBERT multi-vector representations"

[features]
default = []
# Real BGE-M3 inference via ONNX Runtime (requires model files, see onnx module).
onnx = ["dep:ort", "dep:tokenizers"]

[dependencies]
ragnarok-core.workspace = true
ragnarok-resource.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
sha2.workspace = true
sha1.workspace = true
hex.workspace = true
ort = { version = "2.0.0-rc.15", optional = true }
tokenizers = { version = "0.23", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
