[package]
name = "ragnarok-crawler"
version = "2.0.0"
edition.workspace = true
description = "Filesystem watcher, parsers, chunking engine and read-only IMAP crawler"

[dependencies]
ragnarok-core.workspace = true
ragnarok-store.workspace = true
ragnarok-inference.workspace = true
ragnarok-resource.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tracing.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest.workspace = true
notify = "8"
walkdir = "2"
rayon = "1"
mail-parser = "0.11"
lopdf = "0.36"
zip = "2"
roxmltree = "0.21"
quick-xml = "0.42"
async-imap = "0.12"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1"
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
