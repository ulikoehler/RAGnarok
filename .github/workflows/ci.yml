name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (OCR parser)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  frontend:
    name: frontend build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ragnarok-ui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx ng test --watch=false

  e2e:
    name: browser smoke (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system deps (OCR parser)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: Build daemon (embeds committed UI assets)
        run: cargo build
      - name: Install frontend deps + playwright browser
        working-directory: crates/ragnarok-ui/frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run smoke suite
        working-directory: crates/ragnarok-ui/frontend
        run: npx playwright test

  docker:
    name: image build
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ragnarok:ci
