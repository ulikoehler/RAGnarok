[package]
name = "ragnarok"
version = "2.0.0"
edition.workspace = true
description = "RAGnarok — privacy-first embedded hybrid vector search & RAG engine"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal
ragnarok-core = { path = "crates/ragnarok-core" }
ragnarok-crawler = { path = "crates/ragnarok-crawler" }
ragnarok-inference = { path = "crates/ragnarok-inference" }
ragnarok-store = { path = "crates/ragnarok-store" }
ragnarok-resource = { path = "crates/ragnarok-resource" }
ragnarok-server = { path = "crates/ragnarok-server" }
ragnarok-ui = { path = "crates/ragnarok-ui" }

# shared external
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
dashmap = "6"
parking_lot = "0.13"
bytes = "1"
clap = { version = "4", features = ["derive", "cargo"] }
toml = "0.9"
rayon = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
argon2 = "0.5"
rand = "0.8"

[dependencies]
ragnarok-core = { workspace = true }
ragnarok-crawler = { workspace = true }
ragnarok-inference = { workspace = true }
ragnarok-store = { workspace = true }
ragnarok-resource = { workspace = true }
ragnarok-server = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json.workspace = true
reqwest = { workspace = true, features = ["json"] }

[features]
default = []
## Real BGE-M3 inference via ONNX Runtime (model files required at runtime).
onnx = ["ragnarok-inference/onnx"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
ureq = { version = "3", features = ["json"] }
serde_json.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
